# Cloudflare Pages · umrt-docs
# D1 binding name MUST be DB (matches umrt-portal's convention -- this is
# the SAME shared database, id cad7eb04-167f-4330-b7e4-5e35a52de927, also
# bound as PORTAL_DB in united-mobile-rv). Work orders live alongside the
# jobs/users/sessions tables that database already has.
name = "umrt-docs"
compatibility_date = "2026-09-13"
pages_build_output_dir = "."

[[d1_databases]]
binding = "DB"
database_name = "umrt-portal-db"
database_id = "cad7eb04-167f-4330-b7e4-5e35a52de927"

# New unified DB (2026-09-14) -- schema only, no sync Worker exists yet.
[[d1_databases]]
binding = "UNIFIED_DB"
database_name = "umrt-unified-db"
database_id = "3442db0b-172b-4246-b5e7-6509dfb7cf23"

# R2 bucket for work-order photos (technician-taken repair photos, one per
# job). Added 2026-09-16 for the customer-facing job docs feature. A
# dedicated bucket, not united-mobile-rv's shared `umrt-forum-media` --
# these photos are private per-customer (served with an auth check in
# functions/r2/[[path]].js), unlike the forum's fully-public images, so
# keeping them in a separate bucket avoids any chance of the two access
# models getting mixed up.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "umrt-work-order-photos"
